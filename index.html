<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rey Savino SB | Acceso</title>
<style>
:root{--gold:#b08a4a;--black:#080808}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#2a2114,#090909 48%,#000);font-family:Inter,Segoe UI,Arial,sans-serif;color:#fff;padding:20px}.card{width:min(430px,100%);background:#0e0e0e;border:1px solid #4a3820;border-radius:22px;padding:30px;box-shadow:0 30px 90px #000b}.mark{width:82px;height:82px;border:1px solid #70552b;background:#17120b;color:var(--gold);font-size:43px;border-radius:20px;display:grid;place-items:center;margin:0 auto 15px}h1{margin:0;text-align:center;font-size:30px;letter-spacing:.05em}p{text-align:center;color:#c8bda9;line-height:1.5;margin:8px 0 24px}label{font-size:12px;font-weight:800;color:#dac79f}.f{display:grid;gap:6px;margin:12px 0}input{width:100%;padding:13px;border-radius:10px;border:1px solid #4a3b24;background:#161616;color:white;font:inherit;outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #b08a4a22}button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--gold);color:#111;font-weight:900;font:inherit;cursor:pointer;margin-top:9px}.err{min-height:20px;text-align:center;color:#ff9b8c;font-size:12px;margin-top:10px}.note{font-size:11px;color:#8e877b;border-top:1px solid #2c251b;margin-top:18px;padding-top:14px;text-align:center;line-height:1.5}.show{display:flex;align-items:center;gap:8px;color:#c8bda9;font-size:12px;margin-top:10px}.show input{width:auto}
</style>
</head>
<body>
<main class="card">
<div class="mark">♛</div>
<h1>REY SAVINO</h1><div style="text-align:center;color:#b08a4a;font-weight:800;font-size:12px;letter-spacing:.18em;margin-top:6px">SB</div>
<p>Sistema de ventas, seguimiento y fidelización de clientes</p>
<form id="login">
<div class="f"><label for="u">Usuario</label><input id="u" autocomplete="username" required></div>
<div class="f"><label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password" required></div>
<label class="show"><input id="show" type="checkbox"> Mostrar contraseña</label>
<div class="err" id="err"></div>
<button id="btn" type="submit">Ingresar al sistema</button>
</form>
<div class="note">Acceso protegido con sesión segura. La sesión expira automáticamente.</div>
</main>
<script>
const $=id=>document.getElementById(id);
$('show').addEventListener('change',e=>$('p').type=e.target.checked?'text':'password');
$('login').addEventListener('submit',async e=>{e.preventDefault();$('err').textContent='';$('btn').disabled=true;$('btn').textContent='Verificando...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value.trim(),password:$('p').value})});if(r.ok)location.href='/api/app';else $('err').textContent='Usuario o contraseña incorrectos.';}catch(x){$('err').textContent='No se pudo conectar con el sistema.';}finally{$('btn').disabled=false;$('btn').textContent='Ingresar al sistema';}});
(async()=>{try{const r=await fetch('/api/session');if(r.ok)location.href='/api/app';}catch(e){}})();
</script>
</body>
</html>
